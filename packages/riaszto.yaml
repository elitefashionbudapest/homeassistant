# Ajax riasztó (alarm_control_panel.vaskut14_otthon) – élesítés hanggal és gombbal.
# Szándékosan csak élesítő szkriptek vannak: hatástalanítani csak az Ajax appban vagy a kezelőn lehet,
# ezért a riasztópanel maga nincs kitéve a hangasszisztensnek, csak ezek a szkriptek.
# Egyetlen kivétel Ádám kérésére: az iskolai reggel (packages/iskola.yaml) 6:30-kor kikapcsolja az éjszakai módot,
# de csak éjszakai módból, és csak ha valamelyik szülő itthon van.
# Második kivétel Ádám kérésére: hazaérkezéskor kikapcsol, ha Ádám telefonja az otthoni Wi-Fin van ÉS a GPS szerint
# 100 m-en belül (home zóna) van – de csak távol (armed_away) módból, éjszakai módhoz sosem nyúl.
script:
  riaszto_ejszakai:
    alias: "Riasztó – éjszakai mód"
    icon: mdi:shield-moon
    mode: single
    sequence:
      - action: alarm_control_panel.alarm_arm_night
        target:
          entity_id: alarm_control_panel.vaskut14_otthon

  # Az esti emlékeztető push gombja és a dashboard „#riaszto” panelje is ezt hívja.
  riaszto_esti_bekapcsolas:
    alias: "Riasztó – éjszakai mód az esti emlékeztetőből"
    icon: mdi:shield-moon
    mode: single
    sequence:
      - action: notify.mobile_app_adam_2
        data:
          message: clear_notification
          data:
            tag: riaszto_este
      - if:
          - condition: state
            entity_id: alarm_control_panel.vaskut14_otthon
            state: [armed_night, armed_away]
        then:
          - action: notify.mobile_app_adam_2
            data:
              title: "🛡️ Riasztó"
              message: "A riasztó már be van kapcsolva, nem változtattam rajta."
        else:
          - action: script.riaszto_ejszakai
          - wait_template: "{{ is_state('alarm_control_panel.vaskut14_otthon', 'armed_night') }}"
            timeout: "00:01:00"
          - action: notify.mobile_app_adam_2
            data:
              title: "🛡️ Riasztó"
              message: >-
                {{ 'Bekapcsoltam az éjszakai módot. Jó éjt!' if wait.completed
                   else 'Nem sikerült éjszakai módba kapcsolni. Nézd meg az Ajax appban, nincs-e nyitva ajtó vagy ablak.' }}

  riaszto_elesites:
    alias: "Riasztó – élesítés (távol)"
    icon: mdi:shield-lock
    mode: single
    sequence:
      - action: alarm_control_panel.alarm_arm_away
        target:
          entity_id: alarm_control_panel.vaskut14_otthon

# Esti emlékeztető: ha 21:30-kor valaki itthon van (valamelyik telefon az otthoni Wi-Fin, vagy a GPS szerint otthon),
# és a riasztó nincs éjszakai
# vagy (teljes) távol módban, push Ádámnak.
# Kritikus értesítés, mert ilyenkor a telefonja Ne zavarjanak módban van. Magától nem élesít,
# csak a push gombjára (vagy a dashboardon) kapcsol éjszakai módba.
automation:
  - id: riaszto_esti_emlekezteto
    alias: "Riasztó – 21:30 emlékeztető, ha nincs éjszakai módban"
    mode: single
    triggers:
      - trigger: time
        at: "21:30:00"
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: alarm_control_panel.vaskut14_otthon
            state: [armed_night, armed_away, arming]
      # valaki itthon van: legalább az egyik telefon az otthoni Wi-Fin, vagy a GPS szerint otthon
      - condition: template
        value_template: >-
          {{ 'Vaskut14' in [states('sensor.adam_2_ssid'), states('sensor.noyaflage_iphone_keszuleke_2_ssid')]
             or is_state('person.vaskut14', 'home') or is_state('person.cerike', 'home') }}
    actions:
      - action: notify.mobile_app_adam_2
        data:
          title: "🛡️ A riasztó nincs éjszakai módban"
          message: "Fél tíz van, de a riasztó még nincs bekapcsolva éjszakára. Bekapcsoljam?"
          data:
            tag: riaszto_este
            # koppintásra a HA app a dashboard nagy gombos „#riaszto” paneljén nyílik meg
            url: /otthon-homerseklet/otthon#riaszto
            push:
              sound:
                name: default
                critical: 1
                volume: 0.6
            actions:
              - action: RIASZTO_EJSZAKAI
                title: "Éjszakai mód bekapcsolása"

  - id: riaszto_esti_valasz
    alias: "Riasztó – esti emlékeztető gombja"
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: RIASZTO_EJSZAKAI}
    actions:
      - action: script.riaszto_esti_bekapcsolas

  - id: riaszto_hazaerkezes_kikapcsol
    alias: "Riasztó – kikapcsolás, ha Ádám hazaért (Wi-Fi + 100 m)"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.adam_2_ssid
        to: Vaskut14
      - trigger: state
        entity_id: person.vaskut14
        to: home
    conditions:
      - condition: state
        entity_id: sensor.adam_2_ssid
        state: Vaskut14
      - condition: state
        entity_id: person.vaskut14
        state: home
      - condition: state
        entity_id: alarm_control_panel.vaskut14_otthon
        state: armed_away
    actions:
      - action: alarm_control_panel.alarm_disarm
        target:
          entity_id: alarm_control_panel.vaskut14_otthon
      - wait_template: "{{ is_state('alarm_control_panel.vaskut14_otthon', 'disarmed') }}"
        timeout: "00:00:30"
      - action: notify.mobile_app_adam_2
        data:
          title: "🏠 Üdv itthon!"
          message: >-
            {{ 'Kikapcsoltam a riasztót.' if wait.completed
               else 'Nem sikerült kikapcsolni a riasztót! Kapcsold ki az Ajax appban vagy a kezelőn.' }}
          data:
            push:
              interruption-level: time-sensitive
