  "automation": [
    {
      "id": "redonyok_esti_lehuzas",
      "alias": "Redőnyök – esti lehúzás (napnyugta + 30 perc)",
      "mode": "single",
      "triggers": [
        {
          "trigger": "sun",
          "event": "sunset",
          "offset": "00:30:00"
        }
      ],
      "actions": [
        {
          "action": "cover.close_cover",
          "target": {
            "entity_id": [
              "cover.redony_nappali_terasz_2",
              "cover.redony_nappali_ablak_1",
              "cover.redony_nappali_ablak_2",
              "cover.redony_konyha",
              "cover.redony_eloszoba",
              "cover.redony_furdo",
              "cover.redony_gyerekszoba_1",
              "cover.redony_gyerekszoba_2",
              "cover.redony_haloszoba_1",
              "cover.redony_haloszoba_2"
            ]
          }
        }
      ]
    },
    {
      "id": "redonyok_hovedelem",
      "alias": "Redőnyök – nyári hővédelem (napirány szerint)",
      "description": "Ha a nap egy ablaksorra süt, és vagy be van kapcsolva a „Hővédelem ma”, vagy nyár van (máj–szept) és kint legalább 28 °C, akkor azokat a redőnyöket részben leengedi. Ha a nap napközben elvonul, vagy a feltétel megszűnik, visszahúzza. Naplemente után nem húz fel semmit.",
      "mode": "single",
      "triggers": [
        {
          "trigger": "time_pattern",
          "minutes": "/5"
        }
      ],
      "actions": [
        {
          "repeat": {
            "for_each": [
              {
                "flag": "input_boolean.redony_hovedelem_dk_terasz",
                "azimut": 150,
                "coverek": [
                  "cover.redony_nappali_terasz_2"
                ]
              },
              {
                "flag": "input_boolean.redony_hovedelem_dk_halo",
                "azimut": 141,
                "coverek": [
                  "cover.redony_haloszoba_2"
                ]
              },
              {
                "flag": "input_boolean.redony_hovedelem_dny",
                "azimut": 220,
                "coverek": [
                  "cover.redony_nappali_ablak_1",
                  "cover.redony_eloszoba",
                  "cover.redony_konyha"
                ]
              },
              {
                "flag": "input_boolean.redony_hovedelem_eny",
                "azimut": 320,
                "coverek": [
                  "cover.redony_nappali_ablak_2",
                  "cover.redony_furdo",
                  "cover.redony_gyerekszoba_1"
                ]
              },
              {
                "flag": "input_boolean.redony_hovedelem_ek",
                "azimut": 49,
                "coverek": [
                  "cover.redony_gyerekszoba_2",
                  "cover.redony_haloszoba_1"
                ]
              }
            ],
            "sequence": [
              {
                "variables": {
                  "nap_az": "{{ state_attr('sun.sun', 'azimuth') | float(0) }}",
                  "nap_mag": "{{ state_attr('sun.sun', 'elevation') | float(-90) }}",
                  "kint": "{{ state_attr('weather.forecast_otthon', 'temperature') | float(0) }}",
                  "szog": "{{ (((nap_az - repeat.item.azimut + 540) % 360) - 180) | abs }}",
                  "napos": "{{ nap_mag >= 10 and szog <= 60 }}",
                  "ma": "{{ is_state('input_boolean.redony_hovedelem_ma', 'on') }}",
                  "auto": "{{ is_state('input_boolean.redony_hovedelem_aktiv', 'on') and 5 <= now().month <= 9 }}",
                  "indit": "{{ ma or (auto and kint >= 28) }}",
                  "tart": "{{ ma or (auto and kint >= 26) }}",
                  "arnyekol": "{{ is_state(repeat.item.flag, 'on') }}"
                }
              },
              {
                "choose": [
                  {
                    "conditions": "{{ napos and indit and not arnyekol }}",
                    "sequence": [
                      {
                        "action": "cover.set_cover_position",
                        "target": {
                          "entity_id": "{{ repeat.item.coverek }}"
                        },
                        "data": {
                          "position": 30
                        }
                      },
                      {
                        "action": "input_boolean.turn_on",
                        "target": {
                          "entity_id": "{{ repeat.item.flag }}"
                        }
                      }
                    ]
                  },
                  {
                    "conditions": "{{ arnyekol and not (napos and tart) }}",
                    "sequence": [
                      {
                        "if": "{{ nap_mag > 5 }}",
                        "then": [
                          {
                            "action": "cover.open_cover",
                            "target": {
                              "entity_id": "{{ repeat.item.coverek }}"
                            }
                          }
                        ]
                      },
                      {
                        "action": "input_boolean.turn_off",
                        "target": {
                          "entity_id": "{{ repeat.item.flag }}"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        }
      ]
    },
    {
      "id": "redonyok_hovedelem_ma_azonnal",
      "alias": "Redőnyök – „Hővédelem ma” azonnali futtatás",
      "mode": "restart",
      "triggers": [
        {
          "trigger": "state",
          "entity_id": "input_boolean.redony_hovedelem_ma",
          "to": [
            "on",
            "off"
          ]
        }
      ],
      "actions": [
        {
          "action": "automation.trigger",
          "target": {
            "entity_id": "automation.redonyok_nyari_hovedelem_napirany_szerint"
          },
          "data": {
            "skip_condition": false
          }
        }
      ]
    },
    {
      "id": "redonyok_hovedelem_ma_ejfel",
      "alias": "Redőnyök – „Hővédelem ma” kikapcsolása éjfélkor",
      "mode": "single",
      "triggers": [
        {
          "trigger": "time",
          "at": "00:00:00"
        }
      ],
      "conditions": [
        {
          "condition": "state",
          "entity_id": "input_boolean.redony_hovedelem_ma",
          "state": "on"
        }
      ],
      "actions": [
        {
          "action": "input_boolean.turn_off",
          "target": {
            "entity_id": "input_boolean.redony_hovedelem_ma"
          }
        }
      ]
    }
  ]
}
