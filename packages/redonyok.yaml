  "script": {
    "redony_rf_kuldes": {
      "alias": "Redőny RF-jel küldése (sorban)",
      "icon": "mdi:radio-tower",
      "mode": "queued",
      "max": 60,
      "fields": {
        "eszkoz": {
          "description": "A betanított eszköz neve a Broadlinkon (pl. nappali_terasz_1)"
        },
        "parancs": {
          "description": "fel, le vagy stop"
        }
      },
      "sequence": [
        {
          "action": "remote.send_command",
          "target": {
            "entity_id": "remote.vaskut14"
          },
          "data": {
            "device": "{{ eszkoz }}",
            "command": "{{ parancs }}"
          }
        },
        {
          "delay": {
            "milliseconds": 700
          }
        }
      ]
