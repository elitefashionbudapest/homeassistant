# Minden redőny egyszerre. A jeleket a redony_rf_kuldes sor küldi egymás után.
script:
  redony_rf_kuldes:
    alias: "Redőny RF-jel küldése (sorban)"
    icon: mdi:radio-tower
    mode: queued
    max: 60
    fields:
      eszkoz:
        description: "A betanított eszköz neve a Broadlinkon (pl. nappali_terasz_1)"
      parancs:
        description: "fel, le vagy stop"
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.vaskut14
        data:
          device: "{{ eszkoz }}"
          command: "{{ parancs }}"
      # szünet a következő jel előtt, hogy a Broadlink ne nyelje el
      - delay:
          milliseconds: 700

  redonyok_mind_fel:
    alias: "Minden redőny fel"
    icon: mdi:arrow-up-bold-box-outline
    mode: single
    sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.redony_nappali_terasz_1
      - action: cover.open_cover
        target:
          entity_id: cover.redony_nappali_terasz_2
      - action: cover.open_cover
        target:
          entity_id: cover.redony_nappali_ablak_1
      - action: cover.open_cover
        target:
          entity_id: cover.redony_nappali_ablak_2
      - action: cover.open_cover
        target:
          entity_id: cover.redony_konyha
      - action: cover.open_cover
        target:
          entity_id: cover.redony_eloszoba
      - action: cover.open_cover
        target:
          entity_id: cover.redony_furdo
      - action: cover.open_cover
        target:
          entity_id: cover.redony_gyerekszoba_1
      - action: cover.open_cover
        target:
          entity_id: cover.redony_gyerekszoba_2
      - action: cover.open_cover
        target:
          entity_id: cover.redony_haloszoba_1
      - action: cover.open_cover
        target:
          entity_id: cover.redony_haloszoba_2
  redonyok_mind_le:
    alias: "Minden redőny le"
    icon: mdi:arrow-down-bold-box-outline
    mode: single
    sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.redony_nappali_terasz_1
      - action: cover.close_cover
        target:
          entity_id: cover.redony_nappali_terasz_2
      - action: cover.close_cover
        target:
          entity_id: cover.redony_nappali_ablak_1
      - action: cover.close_cover
        target:
          entity_id: cover.redony_nappali_ablak_2
      - action: cover.close_cover
        target:
          entity_id: cover.redony_konyha
      - action: cover.close_cover
        target:
          entity_id: cover.redony_eloszoba
      - action: cover.close_cover
        target:
          entity_id: cover.redony_furdo
      - action: cover.close_cover
        target:
          entity_id: cover.redony_gyerekszoba_1
      - action: cover.close_cover
        target:
          entity_id: cover.redony_gyerekszoba_2
      - action: cover.close_cover
        target:
          entity_id: cover.redony_haloszoba_1
      - action: cover.close_cover
        target:
          entity_id: cover.redony_haloszoba_2

# Esti lehúzás: napnyugta után 30 perccel minden redőny le, kivéve a nappali terasz 1-et.
automation:
  - id: redonyok_esti_lehuzas
    alias: "Redőnyök – esti lehúzás (napnyugta + 30 perc)"
    mode: single
    triggers:
      - trigger: sun
        event: sunset
        offset: "00:30:00"
    actions:
      - action: cover.close_cover
        target:
          entity_id:
            - cover.redony_nappali_terasz_2
            - cover.redony_nappali_ablak_1
            - cover.redony_nappali_ablak_2
            - cover.redony_konyha
            - cover.redony_eloszoba
            - cover.redony_furdo
            - cover.redony_gyerekszoba_1
            - cover.redony_gyerekszoba_2
            - cover.redony_haloszoba_1
            - cover.redony_haloszoba_2
