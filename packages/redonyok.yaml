# Redőnyök a Broadlink RM4 Pro-n (remote.vaskut14) keresztül, RF-kódokkal.
# A kódok a Pi-n vannak: .storage/broadlink_remote_*_codes (remote.learn_command, eszköz = slug).
# Visszajelzés nincs, ezért az állapot optimista: az utolsó parancsot mutatja.
# Minden jel a sorba állító script.redony_rf_kuldes-en megy át, hogy egyszerre több redőnynél se vesszen el.
# A pozíció-parancs (a hangasszisztens ezt használja) csak két állást ismer:
# 50% vagy afelett felhúzza, alatta lehúzza a redőnyt.
template:
  - cover:
      - name: "Nappali terasz 1"
        unique_id: redony_nappali_terasz_1
        default_entity_id: cover.redony_nappali_terasz_1
        device_class: shutter
        optimistic: true
        open_cover:
          - action: script.redony_rf_kuldes
            data:
              eszkoz: nappali_terasz_1
              parancs: fel
        close_cover:
          - action: script.redony_rf_kuldes
            data:
              eszkoz: nappali_terasz_1
              parancs: le
        stop_cover:
          - action: script.redony_rf_kuldes
            data:
              eszkoz: nappali_terasz_1
              parancs: stop
        set_cover_position:
          - if:
              - condition: template
                value_template: "{{ position | int(0) >= 50 }}"
            then:
              - action: script.redony_rf_kuldes
                data:
                  eszkoz: nappali_terasz_1
                  parancs: fel
            else:
              - action: script.redony_rf_kuldes
                data:
                  eszkoz: nappali_terasz_1
                  parancs: le
      - name: "Nappali terasz 2"
