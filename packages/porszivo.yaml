# Dreame L40 Ultra AE (vacuum.porszivo) – szobánkénti takarítás.
# A szobák a robot térképének szegmensei (Map 1, a Dreamehome appban szerkesztve):
# 1 = Fürdő, 2 = jobb szélső terület (név egyeztetés alatt), 3 = Gyerekszoba, 4 = Hálószoba, 5 = Előszoba (dokkoló), 6 = Konyha.
# A nappaliba a lépcső miatt nem jut le magától: oda le kell vinni, és ott a script.porszivo_nappali indítja.
# A többszintes térkép be van kapcsolva, így a lenti szintnek saját térképe lesz (az első futás építi fel).
script:
  porszivo_nappali:
    alias: "Porszívó – Nappali (előbb le kell vinni)"
    icon: mdi:sofa
    description: >-
      Takarítás (porszívózás és felmosás) a nappaliban, a nagy szőnyeget erős szívással és mélytisztítással.
      A porszívó magától nem jut le a lépcső miatt.
      Ha még a dokkolón van, előbb kimossa és benedvesíti a felmosót, és szól, hogy most vigyék le;
      ha már lent van, elindítja a takarítást.
    mode: single
    sequence:
      - if: "{{ is_state('vacuum.porszivo', 'docked') }}"
        then:
          # felmosó kimosása a dokkolóban, hogy lent nedves kendővel induljon
          - action: button.press
            target:
              entity_id: button.vaskut_14_self_clean
          - wait_template: "{{ is_state('sensor.vaskut_14_self_wash_base_status', 'washing') }}"
            timeout: "00:01:00"
          - wait_template: "{{ not is_state('sensor.vaskut_14_self_wash_base_status', 'washing') }}"
            timeout: "00:10:00"
          # a nappali Voice bemondja, a telefonra pedig push is megy
          - action: assist_satellite.announce
            target:
              entity_id: assist_satellite.home_assistant_voice_0acc9e_assist_segedallomas
            data:
              message: "A porszívó készen áll. Most leviheted a nappaliba, és ha lent van, szólj, hogy takarítsa a nappalit."
            continue_on_error: true
          - action: notify.mobile_app_adam_2
            data:
              title: "🧹 Porszívó"
              message: >-
                Kimostam és benedvesítettem a felmosót. Most vidd le a porszívót a nappaliba, és indítsd el
                („Hey Mycroft, takarítsd a nappalit”, vagy a dashboardon a Nappali → Takarítás itt).
          - stop: "Felmosó kimosva, le kell vinni"
      # a nagy szőnyeg miatt: szőnyegen maximális szívás és mélytisztítás, a felmosó felemelve (szőnyeg-adaptáció);
      # a mélytisztítás csak a nappalira szól, a takarítás végén visszakapcsol
      - action: switch.turn_on
        target:
          entity_id:
            - switch.vaskut_14_carpet_boost
            - switch.vaskut_14_intensive_carpet_cleaning
      - action: select.select_option
        target:
          entity_id: select.vaskut_14_carpet_cleaning
        data:
          option: adaptation
      - action: vacuum.start
        target:
          entity_id: vacuum.porszivo
      - wait_template: "{{ is_state('vacuum.porszivo', 'cleaning') }}"
        timeout: "00:02:00"
      - wait_template: "{{ states('vacuum.porszivo') not in ['cleaning', 'paused', 'returning'] }}"
        timeout: "04:00:00"
      - action: switch.turn_off
        target:
          entity_id: switch.vaskut_14_intensive_carpet_cleaning

  porszivo_gyerekszoba:
    alias: "Porszívó – Gyerekszoba"
    icon: mdi:teddy-bear
    mode: single
    sequence:
      - action: dreame_vacuum.vacuum_clean_segment
        target:
          entity_id: vacuum.porszivo
        data:
          segments: [3]

  porszivo_haloszoba:
    alias: "Porszívó – Hálószoba"
    icon: mdi:bed-king
    mode: single
    sequence:
      - action: dreame_vacuum.vacuum_clean_segment
        target:
          entity_id: vacuum.porszivo
        data:
          segments: [4]

  porszivo_furdo:
    alias: "Porszívó – Fürdő"
    icon: mdi:shower
    mode: single
    sequence:
      - action: dreame_vacuum.vacuum_clean_segment
        target:
          entity_id: vacuum.porszivo
        data:
          segments: [1]

  porszivo_eloszoba:
    alias: "Porszívó – Előszoba"
    icon: mdi:coat-rack
    mode: single
    sequence:
      - action: dreame_vacuum.vacuum_clean_segment
        target:
          entity_id: vacuum.porszivo
        data:
          segments: [5]

  porszivo_konyha:
    alias: "Porszívó – Konyha"
    icon: mdi:stove
    mode: single
    sequence:
      - action: dreame_vacuum.vacuum_clean_segment
        target:
          entity_id: vacuum.porszivo
        data:
          segments: [6]

  porszivo_minden:
    alias: "Porszívó – Minden szoba"
    icon: mdi:home-floor-1
    mode: single
    sequence:
      - action: vacuum.start
        target:
          entity_id: vacuum.porszivo

# Nappali takarítás közben (amíg a script.porszivo_nappali fut) a nappali Voice bemondja, ha a porszívónak
# gondja van, és a végén azt is, hogy vissza lehet vinni. A telefonra push is megy.
automation:
  - id: porszivo_nappali_hiba
    alias: "Porszívó – nappali takarítás: hiba bemondása"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.vaskut_14_error
        not_to: [no_error, unavailable, unknown]
      - trigger: state
        entity_id: vacuum.porszivo
        to: error
      - trigger: numeric_state
        entity_id: sensor.porszivo_akkumulator
        below: 15
        id: akku
    conditions:
      - condition: state
        entity_id: script.porszivo_nappali
        state: "on"
    actions:
      - variables:
          kod: "{{ states('sensor.vaskut_14_error') }}"
          hiba: >-
            {% set m = {'drop': 'leesésveszélyt érzékel, lehet, hogy a lépcső szélén áll',
                        'cliff': 'leesésveszélyt érzékel, lehet, hogy a lépcső szélén áll',
                        'bumper': 'beakadt az ütközője', 'bumper_repeat': 'beakadt az ütközője',
                        'brush': 'elakadt a főkeféje', 'side_brush': 'elakadt az oldalkeféje',
                        'left_wheel_motor': 'elakadt a kereke', 'right_wheel_motor': 'elakadt a kereke',
                        'turn_suffocate': 'elakadt, nem tud továbbmenni', 'forward_suffocate': 'elakadt, nem tud továbbmenni',
                        'blocked': 'elakadt, nem tud továbbmenni', 'robot_stuck': 'elakadt, nem tud továbbmenni',
                        'carpet': 'nem tud továbbhaladni a szőnyegen', 'battery_low': 'lemerülőben van az akkumulátora',
                        'waterbox_empty': 'kifogyott a vize', 'filter_blocked': 'eltömődött a szűrője',
                        'mop_removed': 'leesett a felmosókendője', 'mop_removed_2': 'leesett a felmosókendője'} %}
            {% if trigger.id == 'akku' %}lemerülőben van az akkumulátora, már csak {{ states('sensor.porszivo_akkumulator') }} százalékon áll
            {%- elif kod in m %}{{ m[kod] }}
            {%- else %}valami gondja van (hibakód: {{ kod }}){% endif %}
      - action: assist_satellite.announce
        target:
          entity_id: assist_satellite.home_assistant_voice_0acc9e_assist_segedallomas
        data:
          message: "Figyelem! A porszívónak a nappaliban {{ hiba }}. Nézd meg, kérlek."
        continue_on_error: true
      - action: notify.mobile_app_adam_2
        data:
          title: "🧹 Porszívó – gond van"
          message: "A porszívónak a nappaliban {{ hiba }}."
          data:
            tag: porszivo_nappali
      # ugyanaz a hiba ne szóljon percenként többször
      - delay: "00:02:00"

  - id: porszivo_nappali_kesz
    alias: "Porszívó – nappali takarítás: vége"
    mode: single
    triggers:
      - trigger: state
        entity_id: script.porszivo_nappali
        from: "on"
        to: "off"
    conditions:
      # a mosás utáni „vidd le” ágnál a porszívó még a dokkolón van, ott nem kell
      - condition: template
        value_template: "{{ not is_state('vacuum.porszivo', 'docked') }}"
    actions:
      - action: assist_satellite.announce
        target:
          entity_id: assist_satellite.home_assistant_voice_0acc9e_assist_segedallomas
        data:
          message: "Végeztem a nappaliban. Vidd vissza a porszívót a dokkolóra, hogy fel tudjon töltődni."
        continue_on_error: true
      - action: notify.mobile_app_adam_2
        data:
          title: "🧹 Porszívó"
          message: "Végzett a nappaliban. Vidd vissza a dokkolóra, hogy fel tudjon töltődni."
          data:
            tag: porszivo_nappali
