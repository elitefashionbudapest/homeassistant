# „Elmentünk” rutin: ha Ádám és Cerike is elhagyta a házat (GPS-zóna, 100 m, ÉS az otthoni Wi-Fi is),
# Ádám kérésére (2026-09-28) automatikusan élesít, 5 perces visszaszámlálással, hogy csak a kivételeknél kelljen
# közbelépni (pl. Csepike itthon marad):
#  - push mindkettőjüknek (koppintásra a dashboard „#elmentunk” panelje nyílik): Ne élesíts / Élesíts, de ne takaríts / Élesíts most;
#  - a nappali Voice bemondja, és 1 perccel a vége előtt újra; itthonról „Hey Mycroft, itthon vagyok” leállítja;
#  - a végén újra ellenőriz: ha közben valaki hazaért, vagy jel utal arra, hogy valaki otthon van, nem élesít.
# Ha már induláskor van ilyen jel (Xbox online, bekapcsolt tévé, lejátszó Apple TV, forgalmazó iPad, azóta nyílt bejárati ajtó),
# nem számol vissza, hanem rákérdez, mint korábban. Ha ma már volt takarítás, csak élesít, nem takarít.
# A „Csepike itthon maradt” kapcsoló (dashboard, hang) ugyanilyen jel: amíg be van kapcsolva, nem élesít magától;
# éjjel 3-kor magától kikapcsol.
# Hazaérkezéskor: a porszívó haza, figyelmeztetés, ha a riasztó élesítve maradt.

notify:
  - platform: group
    name: szulok
    services:
      - service: mobile_app_adam_2
      - service: mobile_app_noyaflage_iphone_keszuleke_2

input_boolean:
  elmentunk_kerdezve:
    name: "Elmentünk – már rákérdezett"
    icon: mdi:home-export-outline
  csepike_itthon:
    name: "Csepike itthon maradt"
    icon: mdi:human-child
  elmentunk_ne_takarits:
    name: "Elmentünk – most ne takarítson"
    icon: mdi:robot-vacuum-off
  elmentunk_leallitva:
    name: "Elmentünk – az élesítést leállították"
    icon: mdi:shield-off-outline

timer:
  elmentunk_elesites:
    name: "Elmentünk – élesítés visszaszámlálás"
    duration: "00:05:00"
    restore: true
    icon: mdi:shield-sync

input_datetime:
  elmentunk_ideje:
    name: "Elmentünk – utolsó távozás ideje"
    has_date: true
    has_time: true
    icon: mdi:clock-out

template:
  - sensor:
      # Csepike iPadjének forgalma a TP-Link Deco szerint (a HACS amosyuen/ha-tplink-deco 30 mp-enként frissít)
      - name: "Csepike iPad forgalom"
        unique_id: csepike_ipad_forgalom
        default_entity_id: sensor.csepike_ipad_forgalom
        unit_of_measurement: "kB/s"
        state_class: measurement
        icon: mdi:tablet
        state: >-
          {{ ((state_attr('device_tracker.csepike_ipad', 'down_kilobytes_per_s') | float(0))
              + (state_attr('device_tracker.csepike_ipad', 'up_kilobytes_per_s') | float(0))) | round(1) }}
  - binary_sensor:
      # használatban: legalább 1 percig 50 kB/s feletti forgalom (videó, játék); 5 percig még annak számít
      - name: "Csepike iPad használatban"
        unique_id: csepike_ipad_hasznalatban
        default_entity_id: binary_sensor.csepike_ipad_hasznalatban
        icon: mdi:tablet-cellphone
        delay_on: "00:01:00"
        delay_off: "00:05:00"
        state: >-
          {{ is_state('device_tracker.csepike_ipad', 'home') and states('sensor.csepike_ipad_forgalom') | float(0) > 50 }}
      - name: "Valaki otthon lehet"
        unique_id: valaki_otthon_lehet
        default_entity_id: binary_sensor.valaki_otthon_lehet
        device_class: occupancy
        icon: mdi:account-question
        state: >-
          {{ is_state('input_boolean.csepike_itthon', 'on')
             or is_state('binary_sensor.csepike_ipad_hasznalatban', 'on')
             or is_state('binary_sensor.domi20181210', 'on')
             or is_state('media_player.nappali_nappali_tv', 'on')
             or is_state('media_player.samsung_5_series_32_ue32k5500', 'on')
             or is_state('media_player.nappali_nappali', 'playing')
             or (states.binary_sensor.vaskut14_bejarat_ajto is not none
                 and states('input_datetime.elmentunk_ideje') not in ['unknown', 'unavailable']
                 and is_state('input_boolean.elmentunk_kerdezve', 'on')
                 and states.binary_sensor.vaskut14_bejarat_ajto.last_changed
                     > (states('input_datetime.elmentunk_ideje') | as_datetime | as_local)) }}
        attributes:
          okok: >-
            {% set o = [] %}
            {% if is_state('input_boolean.csepike_itthon', 'on') %}{% set o = o + ['Csepike itthon maradt'] %}{% endif %}
            {% if is_state('binary_sensor.csepike_ipad_hasznalatban', 'on') %}{% set o = o + ['Csepike iPadjét éppen használják'] %}{% endif %}
            {% if is_state('binary_sensor.domi20181210', 'on') %}{% set o = o + ['az Xbox online'] %}{% endif %}
            {% if is_state('media_player.nappali_nappali_tv', 'on') %}{% set o = o + ['a nappali tévé be van kapcsolva'] %}{% endif %}
            {% if is_state('media_player.samsung_5_series_32_ue32k5500', 'on') %}{% set o = o + ['a gyerekszobai tévé be van kapcsolva'] %}{% endif %}
            {% if is_state('media_player.nappali_nappali', 'playing') %}{% set o = o + ['az Apple TV lejátszik'] %}{% endif %}
            {% if is_state('input_boolean.elmentunk_kerdezve', 'on')
                  and states('input_datetime.elmentunk_ideje') not in ['unknown', 'unavailable']
                  and states.binary_sensor.vaskut14_bejarat_ajto is not none
                  and states.binary_sensor.vaskut14_bejarat_ajto.last_changed > (states('input_datetime.elmentunk_ideje') | as_datetime | as_local) %}
              {% set o = o + ['a bejárati ajtó azóta kinyílt'] %}{% endif %}
            {{ o | join(', ') }}

script:
  elmentunk_leallit:
    alias: "Elmentünk – ne élesíts (valaki itthon van)"
    icon: mdi:shield-off-outline
    description: >-
      Leállítja a távozás utáni automatikus riasztó-élesítést, mert valaki (pl. Csepike) itthon maradt.
      Használd, ha azt mondják: „itthon vagyok”, „ne kapcsold be a riasztót”.
    mode: queued
    sequence:
      - if: "{{ is_state('timer.elmentunk_elesites', 'active') }}"
        then:
          - action: timer.cancel
            target:
              entity_id: timer.elmentunk_elesites
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.elmentunk_leallitva
          - action: notify.szulok
            data:
              message: clear_notification
              data:
                tag: elmentunk
          - action: notify.szulok
            data:
              title: "🏠 Nem élesítek"
              message: "Rendben, nem kapcsolom be a riasztót, és nem takarítok, mert valaki itthon van."

  elmentunk_ne_takarits:
    alias: "Elmentünk – élesíts, de ne takaríts"
    icon: mdi:robot-vacuum-off
    mode: queued
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.elmentunk_ne_takarits
      - action: notify.szulok
        data:
          title: "🏠 Rendben"
          message: "A riasztót élesítem, de takarítást nem indítok."

  elmentunk_most:
    alias: "Elmentünk – élesíts most"
    icon: mdi:shield-lock
    mode: queued
    sequence:
      - if: "{{ is_state('timer.elmentunk_elesites', 'active') }}"
        then:
          - action: timer.finish
            target:
              entity_id: timer.elmentunk_elesites

  elmentunk_elesit_takarit:
    alias: "Elmentünk – élesítés és takarítás"
    icon: mdi:shield-home
    mode: single
    sequence:
      - action: script.riaszto_elesites
      - action: script.porszivo_minden

automation:
  - id: elmentunk_kerdes
    alias: "Elmentünk – távozás: 5 perc múlva élesítés (mindkét telefon távol, Wi-Fin sincs)"
    mode: single
    triggers:
      - trigger: state
        entity_id: [person.vaskut14, person.cerike]
        to: "not_home"
        for: "00:02:00"
      - trigger: state
        entity_id: [sensor.adam_2_ssid, sensor.noyaflage_iphone_keszuleke_2_ssid]
      # az autó elhagyta a házat (az i3 ritkán jelent, ezért ez csak kiegészítő jel)
      - trigger: state
        entity_id: device_tracker.i3_94_location
        from: home
    conditions:
      - condition: state
        entity_id: [person.vaskut14, person.cerike]
        state: "not_home"
      - condition: state
        entity_id: input_boolean.elmentunk_kerdezve
        state: "off"
      # Mindkét telefon ténylegesen lecsatlakozott az otthoni Wi-Fi-ről (ismeretlen állapot NEM elég) –
      # kivéve, ha az autó is elhagyta a házat: akkor elég, ha egyik telefon sincs az otthoni Wi-Fin.
      - condition: template
        value_template: >-
          {% set s = [states('sensor.adam_2_ssid'), states('sensor.noyaflage_iphone_keszuleke_2_ssid')] %}
          {% if states('device_tracker.i3_94_location') not in ['home', 'unknown', 'unavailable'] %}
            {{ 'Vaskut14' not in s }}
          {% else %}
            {{ s | select('in', ['unknown', 'unavailable', 'Vaskut14']) | list | count == 0 }}
          {% endif %}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.elmentunk_kerdezve
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.elmentunk_ideje
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - variables:
          gyanus: "{{ is_state('binary_sensor.valaki_otthon_lehet', 'on') }}"
          okok: "{{ state_attr('binary_sensor.valaki_otthon_lehet', 'okok') }}"
          # ha ma már volt (fenti, dokkolóról induló) takarítás, csak a riasztóra kérdez rá
          volt_takaritas: >-
            {% set t = states('input_datetime.porszivo_utolso_takaritas') %}
            {{ t not in ['unknown', 'unavailable'] and (t | as_datetime | as_local).date() == now().date() }}
          uzenet: >-
            {% if gyanus %}⚠️ Lehet, hogy valaki otthon van: {{ okok }}. Biztosan élesítsek?
            {%- elif volt_takaritas %}Mindketten elmentetek, és ma már volt takarítás. Élesítsem a riasztót?
            {%- else %}Mindketten elmentetek. Élesítsem a riasztót, és indítsam a takarítást?{% endif %}
          gombok: >-
            {% if gyanus and volt_takaritas %}
            [{"action": "ELMENTUNK_SEMMI", "title": "Semmi"}, {"action": "ELMENTUNK_MEGIS_CSAK", "title": "Mégis élesíts", "destructive": true}]
            {% elif gyanus %}
            [{"action": "ELMENTUNK_SEMMI", "title": "Semmi"}, {"action": "ELMENTUNK_MEGIS", "title": "Mégis élesíts + takaríts", "destructive": true}]
            {% elif volt_takaritas %}
            [{"action": "ELMENTUNK_CSAK_ELESIT", "title": "Élesítés"}, {"action": "ELMENTUNK_SEMMI", "title": "Semmi"}]
            {% else %}
            [{"action": "ELMENTUNK_ELESIT", "title": "Élesítés + takarítás"}, {"action": "ELMENTUNK_TAKARIT", "title": "Csak takarítás"}, {"action": "ELMENTUNK_SEMMI", "title": "Semmi"}]
            {% endif %}
      - if: "{{ gyanus }}"
        then:
          # jel utal arra, hogy valaki otthon van: nem számol vissza, csak rákérdez
          - repeat:
              for_each: [notify.mobile_app_adam_2, notify.mobile_app_noyaflage_iphone_keszuleke_2]
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "🏠 Elmentetek"
                    message: "{{ uzenet }}"
                    data:
                      tag: elmentunk
                      push:
                        interruption-level: time-sensitive
                      actions: "{{ gombok }}"
        else:
          - action: "input_boolean.turn_{{ 'on' if volt_takaritas else 'off' }}"
            target:
              entity_id: input_boolean.elmentunk_ne_takarits
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.elmentunk_leallitva
          - action: timer.start
            target:
              entity_id: timer.elmentunk_elesites
          - repeat:
              for_each: [notify.mobile_app_adam_2, notify.mobile_app_noyaflage_iphone_keszuleke_2]
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "🏠 Elmentetek – 5 perc múlva élesítek"
                    message: >-
                      5 perc múlva élesítem a riasztót{{ '' if volt_takaritas else ', és elindítom a takarítást' }}.
                      Ha valaki itthon maradt, koppints ide, és nyomd meg a „Ne élesíts” gombot.
                    data:
                      tag: elmentunk
                      url: /otthon-homerseklet/otthon#elmentunk
                      push:
                        interruption-level: time-sensitive
                      actions: >-
                        {% set g = [{"action": "ELMENTUNK_NE", "title": "Ne élesíts – valaki itthon van", "destructive": true}] %}
                        {% if not volt_takaritas %}{% set g = g + [{"action": "ELMENTUNK_NE_TAKARITS", "title": "Élesíts, de ne takaríts"}] %}{% endif %}
                        {{ g + [{"action": "ELMENTUNK_MOST", "title": "Élesíts most"}] }}
          - action: assist_satellite.announce
            target:
              entity_id: assist_satellite.home_assistant_voice_0acc9e_assist_segedallomas
            data:
              message: "Figyelem! Mindenki elment, öt perc múlva bekapcsol a riasztó. Ha itthon vagy, mondd: Hey Mycroft, itthon vagyok."
            continue_on_error: true
          # egy perccel a vége előtt még egyszer szól
          - wait_template: "{{ not is_state('timer.elmentunk_elesites', 'active') }}"
            timeout: "00:04:00"
          - if: "{{ not wait.completed and is_state('timer.elmentunk_elesites', 'active') }}"
            then:
              - action: assist_satellite.announce
                target:
                  entity_id: assist_satellite.home_assistant_voice_0acc9e_assist_segedallomas
                data:
                  message: "Figyelem! Egy perc múlva bekapcsol a riasztó. Ha itthon vagy, mondd: Hey Mycroft, itthon vagyok."
                continue_on_error: true

  - id: elmentunk_automatikus_elesites
    alias: "Elmentünk – automatikus élesítés a visszaszámlálás végén"
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.elmentunk_elesites
    actions:
      - action: notify.szulok
        data:
          message: clear_notification
          data:
            tag: elmentunk
      - variables:
          meg_tavol: "{{ is_state('person.vaskut14', 'not_home') and is_state('person.cerike', 'not_home') }}"
          gyanus: "{{ is_state('binary_sensor.valaki_otthon_lehet', 'on') }}"
          okok: "{{ state_attr('binary_sensor.valaki_otthon_lehet', 'okok') }}"
          takarit: "{{ is_state('input_boolean.elmentunk_ne_takarits', 'off') }}"
      - choose:
          - conditions: "{{ not meg_tavol }}"
            sequence:
              - action: notify.szulok
                data:
                  title: "🏠 Nem élesítettem"
                  message: "Közben valamelyikőtök hazaért, ezért nem élesítettem."
          - conditions: "{{ gyanus }}"
            sequence:
              - repeat:
                  for_each: [notify.mobile_app_adam_2, notify.mobile_app_noyaflage_iphone_keszuleke_2]
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "🏠 Nem élesítettem"
                        message: "⚠️ Lehet, hogy valaki otthon van: {{ okok }}. Biztosan élesítsek?"
                        data:
                          tag: elmentunk
                          push:
                            interruption-level: time-sensitive
                          actions:
                            - action: ELMENTUNK_SEMMI
                              title: "Semmi"
                            - action: "{{ 'ELMENTUNK_MEGIS' if takarit else 'ELMENTUNK_MEGIS_CSAK' }}"
                              title: "{{ 'Mégis élesíts + takaríts' if takarit else 'Mégis élesíts' }}"
                              destructive: true
          - conditions: "{{ not is_state('alarm_control_panel.vaskut14_otthon', 'disarmed') }}"
            sequence: []
        default:
          - action: script.riaszto_elesites
          - if: "{{ takarit }}"
            then:
              - action: script.porszivo_minden
          - action: notify.szulok
            data:
              title: "🏠 Kész"
              message: "Élesítettem a riasztót{{ ', és elindult a takarítás' if takarit else '' }}."

  - id: elmentunk_valasz
    alias: "Elmentünk – válasz a push gombjaira"
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ELMENTUNK_ELESIT}
        id: elesit
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ELMENTUNK_MEGIS}
        id: megis
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ELMENTUNK_TAKARIT}
        id: takarit
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ELMENTUNK_SEMMI}
        id: semmi
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ELMENTUNK_CSAK_ELESIT}
        id: csak_elesit
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ELMENTUNK_MEGIS_CSAK}
        id: megis_csak
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ELMENTUNK_NE}
        id: ne
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ELMENTUNK_NE_TAKARITS}
        id: ne_takarits
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ELMENTUNK_MOST}
        id: most
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'ne' }}"
            sequence:
              - action: script.elmentunk_leallit
              - stop: "Leállítva"
          - conditions: "{{ trigger.id == 'ne_takarits' }}"
            sequence:
              - action: script.elmentunk_ne_takarits
              - stop: "Takarítás nélkül"
          - conditions: "{{ trigger.id == 'most' }}"
            sequence:
              - action: script.elmentunk_most
              - stop: "Élesítés most"
      # a másik telefonról eltűnik a kérdés
      - repeat:
          for_each: [notify.mobile_app_adam_2, notify.mobile_app_noyaflage_iphone_keszuleke_2]
          sequence:
            - action: "{{ repeat.item }}"
              data:
                message: clear_notification
                data:
                  tag: elmentunk
      - variables:
          meg_tavol: "{{ is_state('person.vaskut14', 'not_home') and is_state('person.cerike', 'not_home') }}"
          gyanus: "{{ is_state('binary_sensor.valaki_otthon_lehet', 'on') }}"
          okok: "{{ state_attr('binary_sensor.valaki_otthon_lehet', 'okok') }}"
      - choose:
          - conditions: "{{ trigger.id == 'semmi' }}"
            sequence: []
          - conditions: "{{ not meg_tavol }}"
            sequence:
              - action: notify.szulok
                data:
                  title: "🏠 Elmentetek"
                  message: "Nem csináltam semmit, mert közben valamelyikőtök hazaért."
          - conditions: "{{ trigger.id in ['elesit', 'csak_elesit'] and gyanus }}"
            sequence:
              - action: notify.szulok
                data:
                  title: "🏠 Nem élesítettem"
                  message: "Azóta jel jött, hogy valaki otthon lehet: {{ okok }}. Semmit nem indítottam."
          - conditions: "{{ trigger.id in ['csak_elesit', 'megis_csak'] }}"
            sequence:
              - action: script.riaszto_elesites
              - action: notify.szulok
                data:
                  title: "🏠 Kész"
                  message: "Élesítettem a riasztót."
          - conditions: "{{ trigger.id in ['elesit', 'megis'] }}"
            sequence:
              - action: script.elmentunk_elesit_takarit
              - action: notify.szulok
                data:
                  title: "🏠 Kész"
                  message: "Élesítettem a riasztót, és elindult a takarítás."
          - conditions: "{{ trigger.id == 'takarit' and gyanus }}"
            sequence:
              - action: notify.szulok
                data:
                  title: "🏠 Nem indítottam takarítást"
                  message: "Azóta jel jött, hogy valaki otthon lehet: {{ okok }}."
          - conditions: "{{ trigger.id == 'takarit' }}"
            sequence:
              - action: script.porszivo_minden
              - action: notify.szulok
                data:
                  title: "🏠 Kész"
                  message: "Elindult a takarítás."

  # ha visszaszámlálás közben kapcsolják be, azonnal leállítja az élesítést
  - id: csepike_itthon_bekapcsolva
    alias: "Elmentünk – Csepike itthon maradt: élesítés leállítása"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.csepike_itthon
        to: "on"
    actions:
      - action: script.elmentunk_leallit

  # minden éjjel magától kikapcsol, hogy másnap ne maradjon bent véletlenül
  - id: csepike_itthon_ejjel_ki
    alias: "Elmentünk – „Csepike itthon maradt” kikapcsolása éjjel"
    mode: single
    triggers:
      - trigger: time
        at: "03:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.csepike_itthon
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.csepike_itthon

  - id: elmentunk_hazaerkezes
    alias: "Elmentünk – hazaérkezés üres házba (porszívó haza, riasztó-emlékeztető)"
    mode: single
    triggers:
      - trigger: state
        entity_id: [person.vaskut14, person.cerike]
        to: "home"
    conditions:
      # csak ha előtte senki nem volt itthon: a másik szülő sincs otthon
      - condition: template
        value_template: >-
          {{ not is_state('person.cerike' if trigger.entity_id == 'person.vaskut14' else 'person.vaskut14', 'home') }}
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.elmentunk_kerdezve
      - action: timer.cancel
        target:
          entity_id: timer.elmentunk_elesites
      - if: "{{ is_state('vacuum.porszivo', 'cleaning') }}"
        then:
          - action: vacuum.return_to_base
            target:
              entity_id: vacuum.porszivo
      - delay: "00:01:30"
      - if: "{{ states('alarm_control_panel.vaskut14_otthon') in ['armed_away', 'armed_home'] }}"
        then:
