# Iskolai reggel: iskolanap előtti estén (vasárnap–csütörtök) 21:00-kor push a szülőknek: „Holnap megy Csepike iskolába?”
# Csak az „Igen” válasz után húzza fel másnap 6:30-kor az összes redőnyt, a hálószobaiak kivételével; „Nem” vagy válasz nélkül nem nyúl semmihez.

input_boolean:
  iskola_holnap:
    name: "Holnap iskola (6:30 redőnyök fel, a hálószoba kivételével)"
    icon: mdi:school

# A válasz a push gombjairól és a dashboard „#iskola” paneljéről is ide fut be.
script:
  iskola_valasz:
    alias: "Iskola – Csepike holnapi reggele"
    icon: mdi:school
    description: >-
      Csepike (a gyerek) iskolai reggele: „igen” esetén holnap 6:30-kor felhúzza az összes redőnyt
      a hálószobaiak kivételével, „nem” esetén nem nyúl hozzájuk. Ezt használd, ha a gyerek ébresztését, iskolába indulását
      vagy a gyerekszoba 6:30-as redőnyét kérik (pl. „holnap ébreszd a gyereket fél hétkor”).
    mode: queued
    fields:
      valasz:
        description: "igen (holnap iskola, 6:30-kor redőny fel) vagy nem"
        example: igen
        required: true
        selector:
          select:
            options: ["igen", "nem"]
    sequence:
      - action: "input_boolean.turn_{{ 'on' if valasz == 'igen' else 'off' }}"
        target:
          entity_id: input_boolean.iskola_holnap
      # mindkét telefonról eltűnik a kérdés, helyette rövid visszaigazolás jön
      - action: notify.szulok
        data:
          message: clear_notification
          data:
            tag: iskola
      - action: notify.szulok
        data:
          title: "🎒 Iskola"
          message: >-
            {{ 'Rendben, holnap 6:30-kor felhúzom az összes redőnyt, a hálószobaiak kivételével.' if valasz == 'igen'
               else 'Rendben, holnap reggel nem nyúlok a redőnyökhöz.' }}

automation:
  - id: iskola_esti_kerdes
    alias: "Iskola – esti kérdés (vasárnap–csütörtök 21:00)"
    mode: single
    triggers:
      - trigger: time
        at: "21:00:00"
    conditions:
      - condition: time
        weekday: [sun, mon, tue, wed, thu]
    actions:
      # ha napközben (pl. hanggal) már beállították, nem kérdez rá újra, csak emlékeztet, hogy le lehet mondani
      - variables:
          mar_be: "{{ is_state('input_boolean.iskola_holnap', 'on') }}"
      - repeat:
          for_each: [notify.mobile_app_adam_2, notify.mobile_app_noyaflage_iphone_keszuleke_2]
          sequence:
            - action: "{{ repeat.item }}"
              data:
                title: "🎒 Holnap iskola?"
                message: >-
                  {{ 'Holnapra már be van állítva: 6:30-kor felhúzom az összes redőnyt, a hálószobaiak kivételével. Ha mégsem kell, nyomd meg a Nem gombot.'
                     if mar_be else 'Holnap megy Csepike iskolába? Ha igen, 6:30-kor felhúzom az összes redőnyt, a hálószobaiak kivételével.' }}
                data:
                  tag: iskola
                  # koppintásra a HA app a dashboard nagy Igen / Nem gombos paneljén nyílik meg
                  url: /otthon-homerseklet/otthon#iskola
                  actions:
                    - action: ISKOLA_IGEN
                      title: "Igen, megy"
                    - action: ISKOLA_NEM
                      title: "Nem"

  - id: iskola_valasz
    alias: "Iskola – válasz a push gombjaira"
    mode: queued
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ISKOLA_IGEN}
        id: igen
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: ISKOLA_NEM}
        id: nem
    actions:
      - action: script.iskola_valasz
        data:
          valasz: "{{ trigger.id }}"

  - id: iskola_reggel
    alias: "Iskola – 6:30 redőnyök fel (a hálószoba kivételével)"
    mode: single
    triggers:
      - trigger: time
        at: "06:30:00"
    conditions:
      - condition: state
        entity_id: input_boolean.iskola_holnap
        state: "on"
    actions:
      - action: cover.open_cover
        target:
          entity_id:
            - cover.redony_gyerekszoba_1
            - cover.redony_gyerekszoba_2
            - cover.redony_nappali_terasz_1
            - cover.redony_nappali_terasz_2
            - cover.redony_nappali_ablak_1
            - cover.redony_nappali_ablak_2
            - cover.redony_eloszoba
            - cover.redony_furdo
            - cover.redony_konyha
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.iskola_holnap
